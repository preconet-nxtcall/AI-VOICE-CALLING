services:
  # Backend API
  - type: web
    name: ai-voice-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn run:app
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: run:app
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: postgresql://ai_voice_calling_user:KUAWPmFAhXjggtKiEUEUnww8hIBTYs3w@dpg-d7sssk67r5hc738j8ogg-a/ai_voice_calling
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FAISS_INDEX_DIR
        value: /data/faiss_indices
      - key: RECORDINGS_DIR
        value: /data/recordings
      - key: TTS_AUDIO_DIR
        value: /data/tts_audio
    disk:
      name: ai-voice-storage
      mountPath: /data
      sizeGB: 1

  # Background Dialer Worker
  - type: worker
    name: ai-voice-dialer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_dialer.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://ai_voice_calling_user:KUAWPmFAhXjggtKiEUEUnww8hIBTYs3w@dpg-d7sssk67r5hc738j8ogg-a/ai_voice_calling
      - key: FAISS_INDEX_DIR
        value: /data/faiss_indices

  # Frontend (Vite)
  - type: static
    name: ai-voice-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-voice-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
