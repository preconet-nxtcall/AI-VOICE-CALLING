services:
  # Backend API
  - type: web
    name: ai-voice-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: flask db upgrade && gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 300 run:app
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: run:app
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: postgresql://ai_voice_calling_db_user:6G9yRTmaPXXEOLguD7ZJnl03B1DWt3nW@dpg-d885kh99rddc73b6cntg-a.singapore-postgres.render.com/ai_voice_calling_db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FAISS_INDEX_DIR
        value: /data/faiss_indices
      - key: RECORDINGS_DIR
        value: /data/recordings
      - key: TTS_AUDIO_DIR
        value: /data/tts_audio
      # ── Public URL (VoiceLink webhook + WebSocket) ──
      - key: PUBLIC_BASE_URL
        value: https://ai-voice-calling-bz0z.onrender.com
      # ── VoiceLink ──
      - key: VOICELINK_DID_NUMBER
        value: "+919484957094"
      - key: VOICELINK_COUNTRY_CODE
        value: ""
      # ── Dialer config ──
      - key: DIALER_USE_CELERY
        value: "false"
      - key: DIALER_SWEEP_TASK_INTERVAL_SECONDS
        value: "15"
      # ── Secret keys: set these manually in the Render dashboard ──
      # OPENAI_API_KEY        → set in Render dashboard → Environment
      # VOICELINK_API_TOKEN   → set in Render dashboard → Environment
      # ELEVENLABS_API_KEY    → set in Render dashboard → Environment
      # ELEVENLABS_VOICE_ID_HINDI_MALE
      # ELEVENLABS_VOICE_ID_HINDI_FEMALE
      # ELEVENLABS_VOICE_ID_ENGLISH_MALE
      # ELEVENLABS_VOICE_ID_ENGLISH_FEMALE
      # ZEPTOMAIL_USER
      # ZEPTOMAIL_API_TOKEN
      # MAIL_DEFAULT_SENDER
    disk:
      name: ai-voice-storage
      mountPath: /data
      sizeGB: 1

  # Background Dialer Worker
  - type: worker
    name: ai-voice-dialer
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run_dialer.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://ai_voice_calling_db_user:6G9yRTmaPXXEOLguD7ZJnl03B1DWt3nW@dpg-d885kh99rddc73b6cntg-a.singapore-postgres.render.com/ai_voice_calling_db
      - key: FAISS_INDEX_DIR
        value: /data/faiss_indices
      - key: VOICELINK_DID_NUMBER
        value: "+919484957094"
      - key: VOICELINK_COUNTRY_CODE
        value: ""
      - key: PUBLIC_BASE_URL
        value: https://ai-voice-calling-bz0z.onrender.com
      - key: DIALER_USE_CELERY
        value: "false"
      - key: DIALER_SWEEP_TASK_INTERVAL_SECONDS
        value: "15"
      # ── Secret keys: set these manually in the Render dashboard ──
      # OPENAI_API_KEY
      # VOICELINK_API_TOKEN
